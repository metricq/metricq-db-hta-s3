# Tests on every push. Documentation: built on every branch, published with
# GitLab Pages from the default branch; sources are docs/*.md (mkdocs.yml).
# Integration tests need the MetricQ stack and S3 and are not run here.
stages:
  - test
  - build
  - deploy

test:
  stage: test
  image: golang:1.25
  script:
    - go vet ./...
    - go vet -tags=integration ./integration
    - go test -race ./...

.mkdocs:
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir -r requirements-docs.txt
  script:
    - mkdocs build --strict --site-dir public

docs:
  extends: .mkdocs
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

pages:
  extends: .mkdocs
  stage: deploy
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
