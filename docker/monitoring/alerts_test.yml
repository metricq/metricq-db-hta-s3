# promtool test rules alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  # 2026-09-28: a panic restarted the process, restored held records were
  # written twice and every later compaction job failed on the overlap.
  - interval: 1m
    input_series:
      - series: 'metricq_db_wal_replayed_frames_total{token="t"}'
        values: '0x10 572x20'
      - series: 'metricq_db_compaction_job_errors_total{token="t"}'
        values: '0+0x30 0+0.5x60'
      - series: 'metricq_db_compaction_jobs_total{token="t"}'
        values: '20x90'
    alert_rule_test:
      - eval_time: 5m
        alertname: MetricQDBUncleanRestart
        exp_alerts: []
      - eval_time: 12m
        alertname: MetricQDBUncleanRestart
        exp_alerts:
          - exp_labels: {token: t}
            exp_annotations:
              summary: "t restarted without a final checkpoint (crash, panic or kill)"
      - eval_time: 30m
        alertname: MetricQDBCompactionFailing
        exp_alerts: []
      - eval_time: 40m
        alertname: MetricQDBCompactionFailing
        exp_alerts:
          - exp_labels: {token: t}
            exp_annotations:
              summary: 't compaction jobs keep failing; see the "background compaction failed" log'

  # Occasional failures between successful jobs are no alert.
  - interval: 1m
    input_series:
      - series: 'metricq_db_compaction_job_errors_total{token="t"}'
        values: '0+0.1x120'
      - series: 'metricq_db_compaction_jobs_total{token="t"}'
        values: '0+1x120'
    alert_rule_test:
      - eval_time: 110m
        alertname: MetricQDBCompactionFailing
        exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'metricq_db_compaction_job_pending{token="t"}'
        values: '0x5 1x30'
      - series: 'metricq_db_compaction_active{token="t"}'
        values: '0x35'
    alert_rule_test:
      - eval_time: 15m
        alertname: MetricQDBCompactionJobPending
        exp_alerts: []
      - eval_time: 25m
        alertname: MetricQDBCompactionJobPending
        exp_alerts:
          - exp_labels: {token: t}
            exp_annotations:
              summary: "t has an unrecovered compaction job; new jobs are blocked"
